name: Build and Deploy Rustdoc

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Workspace cache
        uses: ./.github/actions/workspace-cache

      - name: Install rust
        if: ${{ steps.src-changed.outputs.change == 'true' || steps.deps-changed.outputs.change == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install libfontconfig1-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: Install project dependencies
        if: ${{ steps.src-changed.outputs.change == 'true' || steps.deps-changed.outputs.change == 'true' }}
        run: cargo install --path . --force

      - name: Build rustdoc
        run: cargo doc --no-deps --release
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Prepare documentation files
        run: |
          mkdir -p public
          cp -r target/doc/* public/
          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta http-equiv="refresh" content="0; url=rust_workspace/index.html">
          </head>
          <body>
              Redirecting to documentation...
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
