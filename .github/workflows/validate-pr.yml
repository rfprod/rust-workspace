name: validate-pr

on:
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  HISTFILE: ''

concurrency:
  group: ${{ github.head_ref }}.${{ github.sha }}.validate-pr
  cancel-in-progress: true

jobs:
  premerge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Workspace changed
        id: workspace-changed
        run: |
          bash ./tools/shell/actions/detect-changes.sh \
            --pattern '^src/.*$' \
            --compare-with origin/${{ github.base_ref }}
          if [[ -f "$GITHUB_OUTPUT" ]] && grep -q "changed_files" "$GITHUB_OUTPUT"; then
            echo "change=true" >> $GITHUB_OUTPUT
          else
            echo "change=false" >> $GITHUB_OUTPUT
          fi

      - name: Workspace changed
        id: shelltools-changed
        run: |
          bash ./tools/shell/actions/detect-changes.sh \
            --pattern '^tools/shell/.*$' \
            --compare-with origin/${{ github.base_ref }}
          if [[ -f "$GITHUB_OUTPUT" ]] && grep -q "changed_files" "$GITHUB_OUTPUT"; then
            echo "change=true" >> $GITHUB_OUTPUT
          else
            echo "change=false" >> $GITHUB_OUTPUT
          fi

      - name: Workspace cache
        uses: ./.github/actions/workspace-cache

      - name: Validate the commit messages
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -U pip Commitizen
          git checkout -b premerge
          git fetch origin main:main
          cz check --rev-range main..premerge
          deactivate

      - name: Install rust
        if: steps.workspace-changed.outputs.change == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install libfontconfig1-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: Install project dependencies
        if: steps.workspace-changed.outputs.change == 'true'
        run: cargo install --path . --force

      - name: Check formatting
        if: steps.workspace-changed.outputs.change == 'true'
        run: cargo fmt -- --check

      - name: Lint sources
        if: steps.workspace-changed.outputs.change == 'true'
        run: cargo clippy -- -D warnings

      - name: Unit test
        if: steps.workspace-changed.outputs.change == 'true'
        run: cargo test

      - name: Build test
        if: steps.workspace-changed.outputs.change == 'true'
        run: cargo build

      - name: Lint shell
        if: steps.shelltools-changed.outputs.change == 'true'
        run: |
          sudo apt install shellcheck
          shellcheck tools/shell/*.sh tools/shell/utils/*.sh
