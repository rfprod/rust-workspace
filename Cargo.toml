[package]
name = "rust-workspace"
version = "0.9.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
colored = "3.0.0"
hyper = { version = "1.3.1", features = ["full"] }
hyper-util = { version = "0.1.5", features = ["full"] }
http-body-util = "0.1.2"
tokio = { version = "1.38.0", features = ["full"] }
meval = "0.2"
rand = "0.9.2"
sysinfo = "0.37.2"
# ML Packages for Model Training
linfa = "0.8.1"
linfa-logistic = { version = "0.8.1", features = ["serde"] }
linfa-trees = { version = "0.8.1", features = ["serde"] }
csv = "1.3.0"
ndarray = "0.16.1"
ciborium = "0.2.2"
plotters = "0.3.6"
# GitHub data pipeline
octorust = "0.10.0"
serde_json = "1.0.117"
regex = "1.10.5"
mongodb = { version = "2.8.2", default-features = false, features = ["tokio-sync"] }

[dev-dependencies]

[dev-dependencies.cargo-husky]
version = "1"
default-features = false # Disable features which are enabled by default
features = ["user-hooks"] # Store all hooks in the .cargo-husky/hooks directory
