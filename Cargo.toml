[package]
name = "rust-workspace"
version = "0.11.1"
edition = "2021"
rust-version = "1.95.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
colored = "3.1.1"
hyper = { version = "1.11.1", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
http-body-util = "0.1.5"
tokio = { version = "1.53.1", features = ["full"] }
meval = "0.2"
rand = "0.10.2"
sysinfo = "0.39.6"
# ML Packages for Model Training
linfa = "0.8.1"
linfa-logistic = { version = "0.8.1", features = ["serde"] }
linfa-trees = { version = "0.8.1", features = ["serde"] }
csv = "1.3.0"
ndarray = "0.17.2"
ciborium = "0.2.2"
plotters = "0.3.6"
# GitHub data pipeline
octorust = "0.10.0"
serde = "1.0.229"
serde_json = "1.0.151"
regex = "1.13.1"
mongodb = { version = "3.9.0", features = ["sync"] }
chrono = "0.4.45"

[dev-dependencies]

[dev-dependencies.cargo-husky]
version = "1"
default-features = false # Disable features which are enabled by default
features = ["user-hooks"] # Store all hooks in the .cargo-husky/hooks directory
